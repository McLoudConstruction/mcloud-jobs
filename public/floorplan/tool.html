<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Floorplan Takeoff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a drafting table. The plan sheet sits on top (left on desktop); the ledger of rooms, quantities and checks sits below (right on desktop). */
:root {
  --bg: #e8ebe4;
  --surface: #f7f8f4;
  --surface2: #edf0e9;
  --sheet: #fbfcf9;
  --ink: #17201c;
  --muted: #56625b;
  --line: #c9d0c5;
  --accent: #1c5b4c;
  --accent-ink: #ffffff;
  --accent-soft: #d3e5dd;
  --sel: #d4470b;
  --good: #25703f;
  --good-soft: #d9eadc;
  --warn: #9c4b06;
  --warn-soft: #f5e3cd;
  --info: #31526b;
  --info-soft: #dbe6ee;
  --grid: #e1e5dc;
  --grid-major: #c4ccc0;
  --wall: #1d2823;
  --t1: #dcebdd; --t2: #dae6ef; --t3: #efe5d3; --t4: #eddde2; --t5: #e7e5cf; --t6: #e0e0e8;
  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1311; --surface: #161c19; --surface2: #1c2421; --sheet: #111714; --ink: #e3e9e4; --muted: #9aa79f; --line: #2d3732;
    --accent: #62c4a5; --accent-ink: #07130e; --accent-soft: #1b3a30; --sel: #ff7d44;
    --good: #66c78a; --good-soft: #1a3224; --warn: #f0a552; --warn-soft: #3a2a14; --info: #8dbbd9; --info-soft: #1b2c38;
    --grid: #1b2420; --grid-major: #2a3631; --wall: #d5dcd7;
    --t1: #1b2d24; --t2: #1b2733; --t3: #2d261a; --t4: #2e1f25; --t5: #2a291a; --t6: #25252d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1311; --surface: #161c19; --surface2: #1c2421; --sheet: #111714; --ink: #e3e9e4; --muted: #9aa79f; --line: #2d3732;
  --accent: #62c4a5; --accent-ink: #07130e; --accent-soft: #1b3a30; --sel: #ff7d44;
  --good: #66c78a; --good-soft: #1a3224; --warn: #f0a552; --warn-soft: #3a2a14; --info: #8dbbd9; --info-soft: #1b2c38;
  --grid: #1b2420; --grid-major: #2a3631; --wall: #d5dcd7;
  --t1: #1b2d24; --t2: #1b2733; --t3: #2d261a; --t4: #2e1f25; --t5: #2a291a; --t6: #25252d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--warn-soft); color: var(--warn); padding: 2px 8px; border-radius: 3px; }
.sum { display: flex; gap: 18px; flex-wrap: wrap; }
.sum div { display: flex; flex-direction: column; min-width: 0; }
.sum .k { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sum .v { font-family: var(--font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
@media (min-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1.45fr) minmax(380px, 1fr); }
  .panel { max-height: calc(100vh - 100px); overflow: auto; position: sticky; top: 12px; }
  .canvasWrap { height: min(calc(100vh - 250px), 760px) !important; min-height: 460px; }
}
.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* tools */
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.tgroup { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
.tbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 46px; min-height: 46px; padding: 3px 6px; background: transparent; border: 0; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 10.5px; letter-spacing: 0.03em; }
.tbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tbtn:hover { color: var(--ink); background: var(--surface2); }
.tbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tbtn:disabled { opacity: 0.35; cursor: default; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.ctx { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-height: 34px; }
.ctx .lbl { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-btn { min-height: 34px; padding: 4px 11px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: 13px; }
.chip-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.ctx select { min-height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 3px 6px; }

/* canvas */
.canvasWrap { position: relative; height: clamp(320px, 58vh, 560px); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sheet); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.zoom svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.scalebar { position: absolute; left: 10px; bottom: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
.scalebar i { display: block; height: 5px; border: 1.5px solid var(--muted); border-top: 0; }
.toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--ink); color: var(--bg); padding: 7px 12px; border-radius: 4px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.toast.on { opacity: 1; }

.strip { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; min-height: 40px; padding: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 13px; }
.strip .hint { flex: 1 1 220px; min-width: 0; }
.lenbox { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.lenbox input { width: 110px; min-height: 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); padding: 2px 8px; font-family: var(--font-mono); }
.lenbox .dir { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface2); border-radius: 4px; cursor: pointer; display: grid; place-items: center; }
.lenbox .dir svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { min-height: 36px; padding: 4px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--sel); border-color: var(--sel); background: transparent; }
.btn:disabled { opacity: 0.4; cursor: default; }

/* inspector */
.insp { background: var(--surface); border: 1px solid var(--sel); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.insp-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.insp-h strong { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
label.f input, label.f select { min-height: 38px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); padding: 3px 8px; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); min-width: 0; width: 100%; }
label.f input.mono { font-family: var(--font-mono); }

/* panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; border-radius: 6px 6px 0 0; overflow-x: auto; }
.tab { flex: 1 0 auto; min-height: 44px; padding: 6px 14px; background: transparent; border: 0; border-bottom: 3px solid transparent; cursor: pointer; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-family: var(--font-mono); font-size: 11px; line-height: 18px; }
.pane { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pane h3 { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; margin: 6px 0 0; color: var(--muted); font-weight: 600; }
.note { color: var(--muted); font-size: 13px; margin: 0; }

/* rooms */
details.room { border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); }
details.room[data-sel="1"] { border-color: var(--sel); }
details.room > summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px; cursor: pointer; }
details.room > summary::-webkit-details-marker { display: none; }
.swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--line); flex: none; }
.rname { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rmeta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.rbody { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.check input { width: 20px; height: 20px; }
.counts { color: var(--muted); font-size: 12.5px; }

/* takeoff */
.tk-sum { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; }
.tk-sum .big { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.tk-sum .sm { color: var(--muted); font-size: 12.5px; }
details.set { border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); }
details.set > summary { min-height: 40px; padding: 8px 10px; cursor: pointer; font-weight: 600; }
details.set .fields { padding: 4px 10px 12px; }
.line { border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.line.rule { background: var(--surface2); }
.l-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.l-name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.l-sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.chip { flex: none; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--surface2); color: var(--muted); }
.chip.src-Computed { background: var(--accent-soft); color: var(--accent); }
.chip.src-Counted { background: var(--info-soft); color: var(--info); }
.chip.src-Rule { background: var(--good-soft); color: var(--good); }
.chip.src-Allowance, .chip.src-Manual, .chip.src-Labor { background: var(--warn-soft); color: var(--warn); }
.l-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; align-items: end; margin-top: 4px; }
.l-grid > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.l-grid .k { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.l-grid .v { font-size: 14px; min-height: 36px; display: flex; align-items: center; overflow-wrap: anywhere; }
.l-grid input { min-height: 36px; width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 2px 8px; font-family: var(--font-mono); font-size: 14px; min-width: 0; }
.l-grid .ext .v { font-weight: 600; }
details.l-scope summary { cursor: pointer; font-size: 12px; color: var(--muted); min-height: 28px; display: flex; align-items: center; }
details.l-scope p { margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); }
.addrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(64px, 0.8fr) minmax(64px, 0.8fr) auto; gap: 6px; align-items: end; }
@media (max-width: 480px) { .addrow { grid-template-columns: 1fr 1fr; } .addrow > :first-child { grid-column: 1 / -1; } }

/* checks */
.ck { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); width: 100%; text-align: left; }
button.ck { cursor: pointer; }
.ck .tag { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; margin-top: 1px; }
.ck.warn .tag { background: var(--warn-soft); color: var(--warn); }
.ck.info .tag { background: var(--info-soft); color: var(--info); }
.ck.ok .tag { background: var(--good-soft); color: var(--good); }
.ck span.t { min-width: 0; overflow-wrap: anywhere; }

/* export */
textarea.out { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); padding: 8px; font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media (pointer: coarse) {
  label.f input, label.f select, .l-grid input, .lenbox input, .ctx select, textarea.out { font-size: 16px; }
}

#cv3 { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.canvasWrap[data-mode="3d"] .scalebar { display: none; }

</style>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Floorplan Takeoff</h1><span class="badge" id="exBadge" hidden>Example plan</span></div>
    <div class="sum" id="sum"></div>
  </header>
  <div class="layout">
    <section class="stage" aria-label="Plan sheet">
      <div class="tools" id="tools"></div>
      <div class="ctx" id="ctx"></div>
      <div class="canvasWrap" id="canvasWrap">
        <canvas id="cv" aria-label="Floor plan drawing area"></canvas>
        <canvas id="cv3" hidden aria-label="3D view of the plan"></canvas>
        <div class="zoom">
          <button type="button" data-zoom="in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" data-zoom="out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button type="button" data-zoom="fit" aria-label="Fit plan to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <div class="scalebar" id="scalebar"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="insp" id="insp" hidden></div>
    </section>
    <section class="panel" aria-label="Rooms, takeoff, checks and export">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="pane" id="pane"></div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* ===== Engine: geometry, rooms, takeoff, checks (no DOM) ===== */
'use strict';

/* ---------- small helpers ---------- */
function ptKey(x, y) { return Math.round(x * 10) + ',' + Math.round(y * 10); }
function cross2(ax, ay, bx, by) { return ax * by - ay * bx; }
function gcd(a, b) { return b ? gcd(b, a % b) : a; }

function fmtFtIn(inches) {
  const neg = inches < 0;
  const eighths = Math.round(Math.abs(inches) * 8);
  const ft = Math.floor(eighths / 96);
  const rem = eighths - ft * 96;
  const whole = Math.floor(rem / 8);
  const fr = rem % 8;
  const parts = [];
  if (whole > 0) parts.push(String(whole));
  if (fr > 0) { const g = gcd(fr, 8); parts.push((fr / g) + '/' + (8 / g)); }
  let s = '';
  if (ft > 0) s += ft + "'";
  if (parts.length) s += (ft > 0 ? ' ' : '') + parts.join(' ') + '"';
  if (!s) s = '0"';
  return (neg ? '-' : '') + s;
}

/* defaultUnit: 'ft' means a bare number is feet, 'in' means inches */
function parseLen(str, defaultUnit) {
  if (str == null) return null;
  const s = String(str).trim().toLowerCase();
  if (!s) return null;
  let m = s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|feet|-)\s*(?:(\d+(?:\.\d+)?)(?:\s+(\d+)\/(\d+))?\s*(?:"|in|inch|inches)?)?$/);
  if (m) {
    let v = parseFloat(m[1]) * 12;
    if (m[2]) v += parseFloat(m[2]);
    if (m[3]) v += parseInt(m[3], 10) / parseInt(m[4], 10);
    return v;
  }
  m = s.match(/^(\d+(?:\.\d+)?)(?:\s+(\d+)\/(\d+))?\s*(?:"|in|inch|inches)$/);
  if (m) return parseFloat(m[1]) + (m[2] ? parseInt(m[2], 10) / parseInt(m[3], 10) : 0);
  m = s.match(/^(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)(?:\s+(\d+)\/(\d+))?$/);
  if (m) {
    let v = parseFloat(m[1]) * 12 + parseFloat(m[2]);
    if (m[3]) v += parseInt(m[3], 10) / parseInt(m[4], 10);
    return v;
  }
  m = s.match(/^(\d+(?:\.\d+)?)$/);
  if (m) return parseFloat(m[1]) * (defaultUnit === 'in' ? 1 : 12);
  return null;
}

function fmtNum(n, d) {
  if (d == null) d = 1;
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtMoney(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ---------- polygon helpers ---------- */
function polyArea(P) {
  let a = 0;
  for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p.x * q.y - q.x * p.y; }
  return a / 2;
}
function polyCentroid(P) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i], q = P[(i + 1) % P.length];
    const c = p.x * q.y - q.x * p.y;
    a += c; cx += (p.x + q.x) * c; cy += (p.y + q.y) * c;
  }
  a /= 2;
  return a ? { x: cx / (6 * a), y: cy / (6 * a) } : { x: P[0].x, y: P[0].y };
}
function pointInPoly(pt, P) {
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const a = P[i], b = P[j];
    if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const x = a.x + t * dx, y = a.y + t * dy;
  return { d: Math.hypot(p.x - x, p.y - y), t, x, y };
}
function labelPoint(P) {
  const c = polyCentroid(P);
  if (pointInPoly(c, P)) return c;
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const p of P) { minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x); maxy = Math.max(maxy, p.y); }
  let best = null, bestD = -1;
  for (let i = 1; i < 24; i++) for (let j = 1; j < 24; j++) {
    const q = { x: minx + (maxx - minx) * i / 24, y: miny + (maxy - miny) * j / 24 };
    if (!pointInPoly(q, P)) continue;
    let d = Infinity;
    for (let k = 0; k < P.length; k++) d = Math.min(d, segDist(q, P[k], P[(k + 1) % P.length]).d);
    if (d > bestD) { bestD = d; best = q; }
  }
  return best || { x: P[0].x, y: P[0].y };
}

/* ---------- planar graph ---------- */
function buildGraph(walls) {
  const nodes = new Map();
  const segs = [];
  const getNode = (x, y) => {
    const k = ptKey(x, y);
    let n = nodes.get(k);
    if (!n) { n = { k, x, y }; nodes.set(k, n); }
    return n;
  };
  for (const w of walls) {
    const ax = w.a.x, ay = w.a.y, rx = w.b.x - ax, ry = w.b.y - ay;
    const L = Math.hypot(rx, ry);
    if (L < 1) continue;
    const ps = [{ t: 0, x: ax, y: ay }, { t: 1, x: w.b.x, y: w.b.y }];
    for (const v of walls) {
      if (v === w) continue;
      const sx = v.b.x - v.a.x, sy = v.b.y - v.a.y;
      const sL = Math.hypot(sx, sy);
      if (sL < 1) continue;
      const den = cross2(rx, ry, sx, sy);
      if (Math.abs(den) < 1e-9) continue;
      const qx = v.a.x - ax, qy = v.a.y - ay;
      const t = cross2(qx, qy, sx, sy) / den;
      const u = cross2(qx, qy, rx, ry) / den;
      if (t < -0.6 / L || t > 1 + 0.6 / L || u < -0.6 / sL || u > 1 + 0.6 / sL) continue;
      let px, py;
      if (u * sL < 0.6) { px = v.a.x; py = v.a.y; }
      else if ((1 - u) * sL < 0.6) { px = v.b.x; py = v.b.y; }
      else { px = ax + t * rx; py = ay + t * ry; }
      const tt = ((px - ax) * rx + (py - ay) * ry) / (L * L);
      if (tt * L > 0.5 && (1 - tt) * L > 0.5) ps.push({ t: tt, x: px, y: py });
    }
    ps.sort((p, q) => p.t - q.t);
    const out = [ps[0]];
    for (let i = 1; i < ps.length; i++) {
      if ((ps[i].t - out[out.length - 1].t) * L > 0.5) out.push(ps[i]);
      else if (i === ps.length - 1) out[out.length - 1] = ps[i];
    }
    for (let i = 0; i < out.length - 1; i++) {
      const na = getNode(out[i].x, out[i].y), nb = getNode(out[i + 1].x, out[i + 1].y);
      if (na === nb) continue;
      segs.push({ id: segs.length, wallId: w.id, na, nb, len: Math.hypot(nb.x - na.x, nb.y - na.y), start: out[i].t * L, end: out[i + 1].t * L, t: w.t, h: w.h });
    }
  }
  return { nodes, segs };
}

function pruneDangling(segs) {
  let active = segs.slice();
  const dangling = [];
  let changed = true;
  while (changed) {
    changed = false;
    const deg = new Map();
    for (const s of active) {
      deg.set(s.na.k, (deg.get(s.na.k) || 0) + 1);
      deg.set(s.nb.k, (deg.get(s.nb.k) || 0) + 1);
    }
    const keep = [];
    for (const s of active) {
      if (deg.get(s.na.k) === 1 || deg.get(s.nb.k) === 1) { dangling.push(s); changed = true; } else keep.push(s);
    }
    active = keep;
  }
  return { active, dangling };
}

function findFaces(active) {
  const outs = new Map();
  const hes = [];
  for (const s of active) {
    const h1 = { seg: s, from: s.na, to: s.nb, ang: Math.atan2(s.nb.y - s.na.y, s.nb.x - s.na.x) };
    const h2 = { seg: s, from: s.nb, to: s.na, ang: Math.atan2(s.na.y - s.nb.y, s.na.x - s.nb.x) };
    h1.twin = h2; h2.twin = h1;
    hes.push(h1, h2);
    for (const h of [h1, h2]) {
      if (!outs.has(h.from.k)) outs.set(h.from.k, []);
      outs.get(h.from.k).push(h);
    }
  }
  for (const arr of outs.values()) arr.sort((p, q) => p.ang - q.ang);
  const faces = [];
  const seen = new Set();
  for (const h0 of hes) {
    if (seen.has(h0)) continue;
    const loop = [];
    let h = h0, guard = 0;
    do {
      seen.add(h); loop.push(h);
      const arr = outs.get(h.to.k);
      const i = arr.indexOf(h.twin);
      h = arr[(i - 1 + arr.length) % arr.length];
      guard++;
    } while (h !== h0 && guard < 5000);
    if (h !== h0) continue;
    let a = 0;
    for (const e of loop) a += e.from.x * e.to.y - e.to.x * e.from.y;
    a /= 2;
    if (a > 1) faces.push({ loop, area: a });
  }
  return faces;
}

/* Offset each face edge inward by half its wall thickness; returns inner vertices and edge lengths */
function insetFace(loop) {
  const n = loop.length;
  const lines = loop.map(e => {
    const dx = e.to.x - e.from.x, dy = e.to.y - e.from.y;
    const L = Math.hypot(dx, dy);
    const ux = dx / L, uy = dy / L;
    const d = (e.seg.t || 4.5) / 2;
    return { px: e.from.x - uy * d, py: e.from.y + ux * d, ux, uy };
  });
  const V = [];
  for (let i = 0; i < n; i++) {
    const P = lines[(i - 1 + n) % n], Q = lines[i];
    const den = cross2(P.ux, P.uy, Q.ux, Q.uy);
    if (Math.abs(den) < 1e-6) V.push({ x: Q.px, y: Q.py });
    else {
      const s = cross2(Q.px - P.px, Q.py - P.py, Q.ux, Q.uy) / den;
      V.push({ x: P.px + s * P.ux, y: P.py + s * P.uy });
    }
  }
  const lens = V.map((v, i) => {
    const w = V[(i + 1) % n];
    const dot = (w.x - v.x) * lines[i].ux + (w.y - v.y) * lines[i].uy;
    return Math.max(0, dot);
  });
  return { V, lens, area: Math.abs(polyArea(V)) };
}

const DOORISH = { door: 1, entry: 1, opening: 1 };

/* ---------- analysis: rooms + metrics ---------- */
function analyze(state) {
  const { nodes, segs } = buildGraph(state.walls);
  const { active, dangling } = pruneDangling(segs);
  const faces = findFaces(active).sort((a, b) => b.area - a.area);

  const opsBySeg = new Map();
  for (const o of state.openings) {
    const seg = segs.find(s => s.wallId === o.wallId && o.offset >= s.start - 0.01 && o.offset <= s.end + 0.01);
    if (!seg) continue;
    if (!opsBySeg.has(seg.id)) opsBySeg.set(seg.id, []);
    opsBySeg.get(seg.id).push(o);
  }

  // build derived rooms
  const rooms = faces.map(f => {
    const inset = insetFace(f.loop);
    const poly = f.loop.map(e => ({ x: e.from.x, y: e.from.y }));
    const edges = f.loop.map((e, i) => ({ seg: e.seg, he: e, len: inset.lens[i], ops: opsBySeg.get(e.seg.id) || [] }));
    return { face: f, poly, inner: inset.V, area: inset.area / 144, perim: inset.lens.reduce((s, x) => s + x, 0) / 12, edges, meta: null };
  });

  // match / create room metadata
  const claimed = new Set();
  const oldMeta = state.rooms || [];
  for (const r of rooms) {
    let m = null;
    for (const om of oldMeta) {
      if (claimed.has(om)) continue;
      if (om.labelPt && pointInPoly(om.labelPt, r.poly)) { m = om; break; }
    }
    if (m) claimed.add(m);
    r.meta = m;
  }
  rooms.sort((a, b) => {
    const pa = labelPoint(a.inner), pb = labelPoint(b.inner);
    return Math.abs(pa.y - pb.y) > 24 ? pa.y - pb.y : pa.x - pb.x;
  });
  for (const r of rooms) {
    if (!r.meta) {
      r.meta = { id: uid(state, 'r'), name: 'Room ' + (state.nextRoom++), type: 'room', fin: { floor: '', wall: '', ceil: '', base: '' }, wallFinH: 0, demoFloor: false, labelPt: null };
      claimed.add(r.meta);
    }
    r.label = labelPoint(r.inner);
    r.meta.labelPt = { x: r.label.x, y: r.label.y };
  }
  state.rooms = rooms.map(r => r.meta);

  // half-edge -> room lookup, doors and transitions
  const roomOfHE = new Map();
  rooms.forEach((r, ri) => { r.index = ri; r.edges.forEach(e => roomOfHE.set(e.he, r)); });
  const floorOf = r => (r && r.meta.fin && r.meta.fin.floor) || '';
  for (const r of rooms) {
    r.doorCount = 0; r.windowCount = 0; r.transitions = 0; r.doorWidth = 0;
    for (const e of r.edges) {
      for (const o of e.ops) {
        if (DOORISH[o.kind]) {
          r.doorCount++;
          const other = roomOfHE.get(e.he.twin);
          if (!other) { if (o.kind === 'entry') r.transitions++; }
          else if (floorOf(other) && floorOf(r) && floorOf(other) !== floorOf(r) && r.index < other.index) r.transitions++;
        } else if (o.kind === 'window') r.windowCount++;
      }
    }
    // fixtures
    r.fix = {};
    for (const fx of state.fixtures) {
      if (pointInPoly(fx, r.poly)) r.fix[fx.kind] = (r.fix[fx.kind] || 0) + 1;
    }
  }
  // unique fixtures are counted once: a point inside nested faces is unlikely, but guard anyway
  const seenFx = new Set();
  for (const r of rooms) {
    for (const fx of state.fixtures) {
      if (pointInPoly(fx, r.poly)) {
        if (seenFx.has(fx.id)) { r.fix[fx.kind]--; } else seenFx.add(fx.id);
      }
    }
  }

  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const w of state.walls) for (const p of [w.a, w.b]) { minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x); maxy = Math.max(maxy, p.y); }
  const bbox = isFinite(minx) ? { minx, miny, maxx, maxy } : null;
  return { rooms, dangling, segs, nodes, bbox };
}

function openingDeducted(o, settings) { return (o.w * o.h) / 144 >= (settings.minOpenSF || 0); }

  const P = { x: wl.a.x + g.ux * o.offset, y: wl.a.y + g.uy * o.offset };
  const sill = o.sill || 0;
  const place = (geo, du, dn, y) => toWorld(geo, g.ux, g.uy, P.x + g.ux * du - g.uy * dn, P.y + g.uy * du + g.ux * dn, y || 0);
  if (o.kind === 'door' || o.kind === 'entry') {
    const geo = new THREE.BoxGeometry(o.w - 0.6, o.h - 0.3, 1.75); geo.translate(0, (o.h - 0.3) / 2 + 0.15, 0);
    G.add(new THREE.Mesh(place(geo, 0, 0, 0), solid(o.kind === 'entry' ? '#5a4535' : '#8b6c4c')));
  } else if (o.kind === 'window') {
    const fw = 1.6, dep = Math.min(t, 4.5) * 0.7;
    const parts = [[o.w, fw, 0, sill + fw / 2], [o.w, fw, 0, sill + o.h - fw / 2], [fw, o.h, -(o.w / 2 - fw / 2), sill + o.h / 2], [fw, o.h, o.w / 2 - fw / 2, sill + o.h / 2]];
    for (const p of parts) { const geo = new THREE.BoxGeometry(p[0], p[1], dep); geo.translate(0, 0, 0); G.add(new THREE.Mesh(place(geo, p[2], 0, p[3]), solid('#f4f2ec'))); }
    const gl = new THREE.BoxGeometry(o.w - fw * 2, o.h - fw * 2, 0.3);
    G.add(new THREE.Mesh(place(gl, 0, 0, sill + o.h / 2), solid('#9cc7e6', { transparent: true, opacity: 0.38, roughness: 0.1 })));
  }
  if (o.kind !== 'window' && FIN[state.settings.casingId]) {
    const cw = 2.25, cth = 0.7, mat = solid('#f3f1ea');
    for (const s of [-1, 1]) {
      const dn = s * (t / 2 + cth / 2);
      let geo = new THREE.BoxGeometry(cw, o.h, cth); G.add(new THREE.Mesh(place(geo, -(o.w / 2 + cw / 2), dn, o.h / 2), mat));
      geo = new THREE.BoxGeometry(cw, o.h, cth); G.add(new THREE.Mesh(place(geo, o.w / 2 + cw / 2, dn, o.h / 2), mat));
      geo = new THREE.BoxGeometry(o.w + cw * 2, cw, cth); G.add(new THREE.Mesh(place(geo, 0, dn, o.h + cw / 2), mat));
    }
  }
}

function buildFixture3D(G, f) {
  const k = f.kind, grp = new THREE.Group();
  const white = solid('#f4f4f2', { roughness: 0.35 }), wood = solid('#8a6a49');
  if (k === 'toilet') {
    boxAt(grp, white, 20, 18, 8, 0, 19, -10, 0);
    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(8, 7, 15, 20), white); bowl.scale.set(1.15, 1, 1.25); bowl.position.set(0, 8, 3); grp.add(bowl);
  } else if (k === 'vanity') {
    boxAt(grp, wood, 30, 33, 21, 0, 16.5, 0, 0);
    boxAt(grp, white, 30.6, 1.6, 21.6, 0, 33.8, 0, 0);
    boxAt(grp, solid('#d9dedf', { roughness: 0.3 }), 16, 0.4, 12, 0, 34.7, 1, 0);
  } else if (k === 'tub') {
    boxAt(grp, white, 60, 20, 30, 0, 10, 0, 0);
    boxAt(grp, solid('#e3eaec', { roughness: 0.3 }), 54, 0.5, 24, 0, 20.2, 0, 0);
  } else if (k === 'sink') {
    boxAt(grp, wood, 33, 34, 22, 0, 17, 0, 0);
    boxAt(grp, solid('#6c6f72'), 34, 1.5, 23, 0, 34.8, 0, 0);
    boxAt(grp, solid('#c9cdd0', { roughness: 0.3 }), 24, 0.5, 15, 0, 35.5, 1, 0);
  } else return;
  grp.position.set(f.x, 0, f.y);
  grp.rotation.y = -(f.rot || 0);
  G.add(grp);
}

/* outlets and switches sit on the nearest wall face */
function buildDevice3D(G, f) {
  let best = null;
  for (const w of state.walls) { const s = segDist(f, w.a, w.b); if (!best || s.d < best.d) best = { d: s.d, x: s.x, y: s.y, w }; }
  if (!best) return;
  let dx = f.x - best.x, dy = f.y - best.y; const dl = Math.hypot(dx, dy);
  if (dl < 0.01) { const g = wallGeom(best.w); dx = -g.uy; dy = g.ux; } else { dx /= dl; dy /= dl; }
  const off = best.w.t / 2 + 0.4;
  const m = new THREE.Mesh(new THREE.BoxGeometry(2.9, 4.6, 0.6), solid(f.kind === 'switch' ? '#efe9dc' : '#f3f1ea'));
  m.position.set(best.x + dx * off, f.kind === 'switch' ? 48 : 16, best.y + dy * off);
  m.rotation.y = Math.atan2(dx, dy);
  G.add(m);
}

function build3D() {
  const G = new THREE.Group();
  const S = state.settings;
  const byId = {}; state.walls.forEach(w => { byId[w.id] = w; });

  // wall cores, with openings cut out
  for (const w of state.walls) {
    const g = wallGeom(w), ext = w.t / 2, H = w.h;
    const shape = new THREE.Shape();
    shape.moveTo(-ext, 0); shape.lineTo(g.L + ext, 0); shape.lineTo(g.L + ext, H); shape.lineTo(-ext, H); shape.closePath();
    for (const o of state.openings) {
      if (o.wallId !== w.id) continue;
      const v0 = Math.max(o.sill || 0, 0.1), v1 = Math.min((o.sill || 0) + o.h, H - 0.1);
      if (v1 > v0) addHole(shape, o.offset - o.w / 2, v0, o.offset + o.w / 2, v1);
    }
    const geo = new THREE.ExtrudeGeometry(shape, { depth: w.t, bevelEnabled: false });
    geo.translate(0, 0, -w.t / 2);
    toWorld(geo, g.ux, g.uy, w.a.x, w.a.y, 0);
    G.add(new THREE.Mesh(geo, [solid(WALL_FACE), solid(WALL_EDGE)]));
  }

  for (const r of AN.rooms) {
    const m = r.meta, f = m.fin || {};
    // floor, out to the wall centerlines so doorways have no gap
    const fs = new THREE.Shape(r.poly.map(p => new THREE.Vector2(p.x, p.y)));
    const fg = new THREE.ShapeGeometry(fs); fg.rotateX(Math.PI / 2);
    const fm = new THREE.Mesh(fg, matFor('floor', f.floor)); fm.userData.roomId = m.id; G.add(fm);
    if (S && state.settings && v3.ceil) {
      const cg = new THREE.ShapeGeometry(new THREE.Shape(r.poly.map(p => new THREE.Vector2(p.x, p.y)))); cg.rotateX(Math.PI / 2);
      const cm = new THREE.Mesh(cg, matFor('ceil', f.ceil)); cm.position.y = S.wallH; cm.userData.roomId = m.id; G.add(cm);
    }
    const n = r.inner.length;
    r.edges.forEach((e, i) => {
      const V0 = r.inner[i], V1 = r.inner[(i + 1) % n];
      const ell = Math.hypot(V1.x - V0.x, V1.y - V0.y);
      if (ell < 1) return;
      const ex = (V1.x - V0.x) / ell, ey = (V1.y - V0.y) / ell;
      const H = e.seg.h || S.wallH, Hw = m.wallFinH ? Math.min(H, m.wallFinH) : H;
      // wall finish face
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(ell, 0); shape.lineTo(ell, Hw); shape.lineTo(0, Hw); shape.closePath();
      const doors = [];
      for (const o of e.ops) {
        const wl = byId[o.wallId]; if (!wl) continue;
        const gm = wallGeom(wl);
        const P = { x: wl.a.x + gm.ux * o.offset, y: wl.a.y + gm.uy * o.offset };
        const u = (P.x - V0.x) * ex + (P.y - V0.y) * ey;
        const u0 = Math.max(0.1, u - o.w / 2), u1 = Math.min(ell - 0.1, u + o.w / 2);
        const v0 = Math.max(o.sill || 0, 0.1), v1 = Math.min((o.sill || 0) + o.h, Hw - 0.1);
        if (u1 - u0 > 1 && v1 > v0) addHole(shape, u0, v0, u1, v1);
        if (o.kind !== 'window') doors.push([Math.max(0, u - o.w / 2), Math.min(ell, u + o.w / 2)]);
      }
      if (f.wall) {
        const wg = new THREE.ShapeGeometry(shape);
        toWorld(wg, ex, ey, V0.x - ey * 0.1, V0.y + ex * 0.1, 0);
        const wm = new THREE.Mesh(wg, matFor('wall', f.wall)); wm.userData.roomId = m.id; G.add(wm);
      }
      // base trim, broken at doorways
      if (f.base) {
        doors.sort((a, b) => a[0] - b[0]);
        let cur = 0; const spans = [];
        for (const d of doors) { if (d[0] > cur + 0.5) spans.push([cur, d[0]]); cur = Math.max(cur, d[1]); }
        if (ell > cur + 0.5) spans.push([cur, ell]);
        for (const s of spans) {
          const len = s[1] - s[0];
          const bg = new THREE.BoxGeometry(len, 4, 0.6); bg.translate(len / 2, 2, 0.4);
          toWorld(bg, ex, ey, V0.x + ex * s[0], V0.y + ey * s[0], 0);
          const bm = new THREE.Mesh(bg, matFor('base', f.base)); bm.userData.roomId = m.id; G.add(bm);
        }
      }
    });
  }
  for (const o of state.openings) { const wl = byId[o.wallId]; if (wl) buildOpening3D(G, o, wl); }
  for (const f of state.fixtures) {
    if (f.kind === 'outlet' || f.kind === 'switch') buildDevice3D(G, f);
    else if (f.kind === 'light') { if (v3.ceil) { const d = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.4, 16), solid('#fffdf2', { emissive: new THREE.Color('#fff4cc') })); d.position.set(f.x, state.settings.wallH - 0.3, f.y); G.add(d); } }
    else buildFixture3D(G, f);
  }
  return G;
}

/* ---------- renderer and camera ---------- */
function init3D() {
  if (v3.renderer) return true;
  try {
    if (typeof THREE === 'undefined') return false;
    const r = new THREE.WebGLRenderer({ canvas: cv3, antialias: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    v3.renderer = r;
  } catch (e) { v3.renderer = null; return false; }
  v3.scene = new THREE.Scene();
  v3.camera = new THREE.PerspectiveCamera(46, 1, 5, 40000);
  v3.scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8a82, 0.85));
  const d = new THREE.DirectionalLight(0xffffff, 0.6); d.position.set(300, 800, 260); v3.scene.add(d);
  return true;
}
function size3D() {
  if (!v3.renderer || !cssW) return;
  v3.renderer.setSize(cssW, cssH, false);
  v3.camera.aspect = cssW / cssH; v3.camera.updateProjectionMatrix();
}
function frame3D(preset) {
  const b = AN.bbox || { minx: 0, miny: 0, maxx: 240, maxy: 180 };
  v3.tx = (b.minx + b.maxx) / 2; v3.tz = (b.miny + b.maxy) / 2;
  const span = Math.max(b.maxx - b.minx, b.maxy - b.miny, 120);
  if (preset === 'top') { v3.ph = 0.03; v3.th = -Math.PI / 2; v3.r = span * 1.5; }
  else if (preset === 'low') { v3.ph = 1.28; v3.th = -0.9; v3.r = span * 1.05; }
  else { v3.ph = 0.95; v3.th = -0.75; v3.r = span * 1.45; }
}
function render3D() {
  if (!v3.renderer || v3.raf) return;
  v3.raf = requestAnimationFrame(() => {
    v3.raf = 0;
    const s = Math.sin(v3.ph), c = v3.camera;
    c.position.set(v3.tx + v3.r * s * Math.cos(v3.th), v3.r * Math.cos(v3.ph), v3.tz + v3.r * s * Math.sin(v3.th));
    c.lookAt(v3.tx, 30, v3.tz);
    v3.renderer.render(v3.scene, c);
  });
}
function rebuild3D() {
  if (!v3.renderer) return;
  if (v3.group) {
    v3.scene.remove(v3.group);
    v3.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
  v3.group = build3D();
  v3.scene.add(v3.group);
  v3.scene.background = new THREE.Color(C.sheet);
  render3D();
}
function setMode(m) {
  if (m === mode) return;
  if (m === '3d') {
    if (!init3D()) { toast('3D view is not available in this browser'); return; }
    mode = '3d'; pending = null; curSnap = null; sel = sel && sel.type === 'room' ? sel : null;
    wrap.dataset.mode = '3d'; cv.hidden = true; cv3.hidden = false;
    resize(); size3D(); frame3D('iso'); rebuild3D();
  } else {
    mode = '2d'; wrap.dataset.mode = '2d'; cv3.hidden = true; cv.hidden = false;
    resize(); draw();
  }
  renderTools(); renderCtx(); renderStrip(); renderInspector();
}

/* ---------- orbit controls ---------- */
function p3(e) { const r = cv3.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv3.addEventListener('pointerdown', e => {
  try { cv3.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const p = p3(e); v3.ptrs.set(e.pointerId, p);
  if (v3.ptrs.size === 2) {
    const [a, b] = Array.from(v3.ptrs.values());
    v3.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, r: v3.r, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    v3.g = null; return;
  }
  v3.g = { x: p.x, y: p.y, moved: false };
});
cv3.addEventListener('pointermove', e => {
  const p = p3(e);
  if (!v3.ptrs.has(e.pointerId)) return;
  const prev = v3.ptrs.get(e.pointerId); v3.ptrs.set(e.pointerId, p);
  if (v3.pinch && v3.ptrs.size >= 2) {
    const [a, b] = Array.from(v3.ptrs.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    v3.r = Math.max(60, Math.min(20000, v3.pinch.r * v3.pinch.d / d));
    const k = 0.83 * v3.r / (cssH || 400);
    const rx = mx - v3.pinch.mx, ry = my - v3.pinch.my;
    v3.tx += -Math.sin(v3.th) * rx * k - Math.cos(v3.th) * ry * k;
    v3.tz += Math.cos(v3.th) * rx * k - Math.sin(v3.th) * ry * k;
    v3.pinch.mx = mx; v3.pinch.my = my;
    render3D(); return;
  }
  if (!v3.g) return;
  if (Math.hypot(p.x - v3.g.x, p.y - v3.g.y) > 5) v3.g.moved = true;
  if (!v3.g.moved) return;
  v3.th += (p.x - prev.x) * 0.008;
  v3.ph = Math.max(0.03, Math.min(1.5, v3.ph - (p.y - prev.y) * 0.006));
  render3D();
});
function end3(e, cancel) {
  const p = p3(e);
  v3.ptrs.delete(e.pointerId);
  if (v3.pinch) { if (v3.ptrs.size < 2) v3.pinch = null; v3.g = null; return; }
  const g3 = v3.g; v3.g = null;
  if (!g3 || cancel || g3.moved) return;
  pick3D(p);
}
cv3.addEventListener('pointerup', e => end3(e, false));
cv3.addEventListener('pointercancel', e => end3(e, true));
cv3.addEventListener('wheel', e => { e.preventDefault(); v3.r = Math.max(60, Math.min(20000, v3.r * (e.deltaY < 0 ? 0.9 : 1.1))); render3D(); }, { passive: false });
cv3.addEventListener('contextmenu', e => e.preventDefault());

function pick3D(p) {
  if (!v3.renderer || !v3.group) return;
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((p.x / cssW) * 2 - 1, -(p.y / cssH) * 2 + 1), v3.camera);
  const hits = rc.intersectObjects(v3.group.children.filter(o => o.userData && o.userData.roomId), false);
  if (!hits.length) return;
  const id = hits[0].object.userData.roomId;
  sel = { type: 'room', id }; openRooms.add(id); tab = 'rooms';
  renderPanel(); scrollToRoom(id);
  const m = state.rooms.find(r => r.id === id);
  if (m) toast(m.name + ': change its finishes in the Rooms tab');
}

/* ---------- embed bridge (used when loaded inside the McLoud Jobs app) ---------- */
if (EMBED) {
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || typeof m !== 'object') return;
    if (m.type === 'fp:load') {
      var s = m.plan && Array.isArray(m.plan.walls) ? m.plan : newState();
      state = Object.assign(newState(), s, { settings: Object.assign(defaultSettings(), s.settings || {}) });
      state.example = false;
      undoStack.length = 0; redoStack.length = 0; sel = null; pending = null;
      recompute(); view.init = false; refresh();
      if (typeof resize === 'function') resize();
    } else if (m.type === 'fp:prefill' && m.byName) {
      // suggest prices from the saved price memory; never overwrite one already typed
      var n = 0;
      TK.lines.forEach(function (l) {
        var p = m.byName[String(l.name).toLowerCase()];
        if (p != null && (state.prices[l.key] == null || state.prices[l.key] === '')) { state.prices[l.key] = Number(p); n++; }
      });
      if (n) { recompute(); scheduleSave(); refresh(); }
    }
  });
  window.parent.postMessage({ type: 'fp:ready' }, '*');
}

boot();

</script>
